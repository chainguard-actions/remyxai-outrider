name: Test basic invocation without API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: 'test-interest-00000000-0000-0000-0000-000000000000'
          mode: 'recommend'
          min-confidence: 'high'
          rate-limit-days: '0'

      - name: Assert status is set and reflects an error or skip (no API key)
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          # Without REMYX_API_KEY the action should either set status=error
          # or fail the step. Either is acceptable — what we must NOT see is
          # a successful pr_opened / issue_opened with a fake interest-id.
          if [ "$STATUS" = "pr_opened" ] || [ "$STATUS" = "pr_opened_draft" ] || [ "$STATUS" = "issue_opened" ]; then
            echo "FAIL: action unexpectedly succeeded with a fake interest-id and no API key"
            exit 1
          fi
          echo "PASS: status='$STATUS' outcome='$OUTCOME' — no spurious artifact created"
