name: Test provider=moonshot fails when MOONSHOT_API_KEY is missing
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          interest-id: 'test-interest-id-placeholder'
          mode: 'recommend'
          provider: 'moonshot'
          enable-cocoindex: 'false'
        env:
          REMYX_API_KEY: 'fake-key-for-test'
          # Intentionally NOT setting MOONSHOT_API_KEY to trigger the validation error
        continue-on-error: true

      - name: Assert action failed due to missing MOONSHOT_API_KEY
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when MOONSHOT_API_KEY is missing for provider=moonshot"
          else
            echo "FAIL: expected failure but got outcome: $OUTCOME"
            exit 1
          fi
