name: Test recommend mode with publish=branch
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: '00000000-0000-0000-0000-000000000000'
          mode: recommend
          publish: 'branch'
          chain: 'false'
          rate-limit-days: '0'
          min-confidence: 'low'
          enable-cocoindex: 'false'

      - name: Assert action ran and produced a recognizable outcome
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but status output is empty"
              exit 1
            fi
            # In branch-publish mode, no PR is opened — status should not be pr_opened*
            if echo "$STATUS" | grep -q "^pr_opened"; then
              echo "WARN: publish=branch mode produced a PR status: $STATUS"
            fi
            echo "PASS: action succeeded with status='$STATUS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid REMYX_API_KEY / interest-id)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
