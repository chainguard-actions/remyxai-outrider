name: Test confidence gate input acceptance
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: 'test-interest-00000000-0000-0000-0000-000000000000'
          mode: 'recommend'
          min-confidence: 'high'
          draft-mode: 'always'
          rate-limit-days: '7'
          test-integration-policy: 'strict'
          lookback: 'week'
          candidate-pool: '5'
          claude-timeout: '60'

      - name: Assert action does not create spurious artifacts with fake credentials
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
          PR_URL: ${{ steps.action.outputs.pr_url }}
          ISSUE_URL: ${{ steps.action.outputs.issue_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          echo "pr_url: $PR_URL"
          echo "issue_url: $ISSUE_URL"
          # With a fake interest-id and no REMYX_API_KEY the action must not
          # open a real PR or Issue.
          if [ "$STATUS" = "pr_opened" ] || [ "$STATUS" = "pr_opened_draft" ]; then
            echo "FAIL: action opened a PR with fake credentials"
            exit 1
          fi
          if [ "$STATUS" = "issue_opened" ]; then
            echo "FAIL: action opened an Issue with fake credentials"
            exit 1
          fi
          # pr_url and issue_url must be empty when no artifact was created.
          if [ -n "$PR_URL" ]; then
            echo "FAIL: pr_url is unexpectedly set: $PR_URL"
            exit 1
          fi
          if [ -n "$ISSUE_URL" ]; then
            echo "FAIL: issue_url is unexpectedly set: $ISSUE_URL"
            exit 1
          fi
          echo "PASS: no spurious artifact created (status='$STATUS', outcome='$OUTCOME')"
