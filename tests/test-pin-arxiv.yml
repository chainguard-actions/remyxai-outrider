name: Test pin-arxiv input
on:
  workflow_dispatch:

jobs:
  test-pin-arxiv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: 'test-interest-00000000-0000-0000-0000-000000000000'
          mode: 'recommend'
          chain: 'false'
          rate-limit-days: '0'
          enable-cocoindex: 'false'
          pin-arxiv: '2301.00001'
          min-confidence: 'low'

      - name: Assert action ran with pin-arxiv input or failed gracefully
        env:
          STATUS: ${{ steps.action.outputs.status }}
          ARXIV: ${{ steps.action.outputs.arxiv }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          echo "arxiv: $ARXIV"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but status output is empty"
              exit 1
            fi
            # If a paper was implemented, arxiv output should match the pinned id
            if [ -n "$ARXIV" ] && [ "$ARXIV" != "2301.00001" ]; then
              echo "FAIL: expected arxiv='2301.00001' but got '$ARXIV'"
              exit 1
            fi
            echo "PASS: action succeeded with status='$STATUS', arxiv='$ARXIV'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real REMYX_API_KEY)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
