name: Test pin-arxiv and off integration policy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          interest-id: 'test-interest-id-00000000-0000-0000-0000-000000000000'
          mode: 'recommend'
          min-confidence: 'low'
          draft-mode: 'on_test_failure'
          rate-limit-days: '0'
          test-integration-policy: 'off'
          lookback: 'month'
          candidate-pool: '10'
          pin-arxiv: '2301.00001'
          guardrails-allowlist: '*.ts,*.js'
        continue-on-error: true

      - name: Assert status output is set
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          if [ -z "$STATUS" ]; then
            echo "FAIL: expected status output to be set (got empty string)"
            exit 1
          fi
          echo "PASS: status output is set to '$STATUS'"

      - name: Assert status is a known value
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          case "$STATUS" in
            pr_opened|pr_opened_draft|issue_opened|\
            skipped_low_confidence|skipped_rate_limit|\
            skipped_pr_exists|skipped_issue_exists|\
            skipped_test_failure|claude_failed|\
            rejected_path_violations|error)
              echo "PASS: status '$STATUS' is a recognized value"
              ;;
            *)
              echo "FAIL: status '$STATUS' is not a recognized value"
              exit 1
              ;;
          esac

      - name: Assert tier output is valid when set
        env:
          TIER: ${{ steps.action.outputs.tier }}
        run: |
          echo "tier: $TIER"
          if [ -n "$TIER" ]; then
            case "$TIER" in
              high|moderate|low|noise)
                echo "PASS: tier '$TIER' is a recognized value"
                ;;
              *)
                echo "FAIL: tier '$TIER' is not a recognized value"
                exit 1
                ;;
            esac
          else
            echo "PASS: tier is empty (no recommendation made)"
          fi
