name: Test provider input validation (missing key fails cleanly)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: '00000000-0000-0000-0000-000000000000'
          mode: recommend
          chain: 'false'
          provider: 'zai'
          enable-cocoindex: 'false'
        # ZAI_API_KEY is intentionally NOT set in env — should fail with a clear error

      - name: Assert action fails cleanly when provider key is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # provider=zai without ZAI_API_KEY should cause the action to fail
          # with a specific error message (not silently succeed)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when ZAI_API_KEY is missing for provider=zai"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when ZAI_API_KEY is missing for provider=zai"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
