name: Test recommend mode basic invocation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          interest-id: 'test-interest-id-placeholder'
          mode: 'recommend'
          rate-limit-days: '0'
          min-confidence: 'low'
          chain: 'false'
          enable-cocoindex: 'false'
        env:
          REMYX_API_KEY: 'fake-key-for-test'
          ANTHROPIC_API_KEY: 'fake-anthropic-key-for-test'
        continue-on-error: true

      - name: Assert action produced a status output or failed gracefully
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "status output: $STATUS"
          # Without a real REMYX_API_KEY, the action should either:
          # - produce status=error (if it reaches run.py and fails there)
          # - fail the step (if it fails during setup/install)
          # Either is acceptable — we're verifying the action structure is valid
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran and produced a deterministic outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
