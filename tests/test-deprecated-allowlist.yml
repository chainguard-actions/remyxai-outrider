name: Test deprecated guardrails-allowlist input is ignored
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          interest-id: 'test-interest-00000000-0000-0000-0000-000000000000'
          mode: recommend
          rate-limit-days: '0'
          chain: 'false'
          enable-cocoindex: 'false'
          guardrails-allowlist: 'src/**'
        continue-on-error: true

      - name: Assert action ran with deprecated input (did not crash workflow)
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          # The deprecated guardrails-allowlist input should be silently ignored
          # (logs a deprecation warning). The action requires real API credentials
          # to complete; without them it fails gracefully. We verify the action
          # completed (success or failure) rather than crashing the runner.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with deprecated input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert status is a known value or empty (no credentials)
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          # Empty status is acceptable when the action fails before setting output
          # (e.g. missing REMYX_API_KEY or ANTHROPIC_API_KEY).
          if [ -z "$STATUS" ]; then
            echo "PASS: status is empty (action failed before setting output — expected without credentials)"
            exit 0
          fi
          case "$STATUS" in
            pr_opened|pr_opened_draft|issue_opened|\
            skipped_low_confidence|skipped_open_artifact|\
            skipped_issues_disabled|skipped_pr_exists|\
            skipped_issue_exists|skipped_test_failure|\
            claude_failed|skipped_no_method_match|\
            rejected_path_violations|aborted_secret_in_payload|error)
              echo "PASS: status '$STATUS' is a known value"
              ;;
            *)
              echo "FAIL: status '$STATUS' is not a recognized value"
              exit 1
              ;;
          esac
