name: Test basic recommend mode (graceful failure without API key)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: 'test-interest-00000000-0000-0000-0000-000000000000'
          mode: recommend
          rate-limit-days: '0'
          chain: 'false'
          min-confidence: 'low'
          enable-cocoindex: 'false'

      - name: Assert action ran and produced a recognizable outcome
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          # The action should either succeed (unlikely without real creds) or
          # fail gracefully. Either way, the step must not be skipped.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was unexpectedly skipped"
            exit 1
          fi
          # If it succeeded, status must be a known value
          if [ "$OUTCOME" = "success" ]; then
            case "$STATUS" in
              pr_opened|pr_opened_draft|issue_opened|\
              skipped_low_confidence|skipped_open_artifact|\
              skipped_issues_disabled|skipped_pr_exists|\
              skipped_issue_exists|skipped_test_failure|\
              claude_failed|skipped_no_method_match|\
              rejected_path_violations|aborted_secret_in_payload|error)
                echo "PASS: action succeeded with status '$STATUS'"
                ;;
              *)
                echo "FAIL: unexpected status value '$STATUS'"
                exit 1
                ;;
            esac
          else
            echo "PASS: action failed gracefully (no real REMYX_API_KEY / sentinel repo)"
          fi
