name: Test weekly-summary mode with no discussion ID
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          interest-id: 'test-interest-id-00000000-0000-0000-0000-000000000000'
          mode: 'weekly-summary'
          weekly-discussion-id: ''
        env:
          REMYX_API_KEY: 'fake-key-for-test'
        continue-on-error: true

      - name: Assert status is weekly_summary_skipped_no_discussion_id
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          if [ -z "$STATUS" ]; then
            echo "FAIL: status output is empty"
            exit 1
          fi
          case "$STATUS" in
            weekly_summary_skipped_no_discussion_id|weekly_summary_failed|weekly_summary_posted|error)
              echo "PASS: status='$STATUS' is a known weekly-summary-mode value"
              ;;
            *)
              echo "FAIL: status='$STATUS' is not a recognized weekly-summary-mode value"
              exit 1
              ;;
          esac
