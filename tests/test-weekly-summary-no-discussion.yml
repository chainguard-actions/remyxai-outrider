name: Test weekly-summary mode (no discussion-id skips cleanly)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: '00000000-0000-0000-0000-000000000000'
          mode: weekly-summary
          weekly-discussion-id: ''
          enable-cocoindex: 'false'

      - name: Assert weekly-summary skips cleanly or fails gracefully
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but status output is empty"
              exit 1
            fi
            # When no discussion-id is set, the action should skip cleanly
            if [ "$STATUS" = "weekly_summary_skipped_no_discussion_id" ]; then
              echo "PASS: weekly-summary skipped cleanly with no discussion-id"
            else
              echo "PASS: action succeeded with status='$STATUS'"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid REMYX_API_KEY)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
