name: Test weekly-summary mode with no discussion ID
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          interest-id: 'test-interest-id-placeholder'
          mode: 'weekly-summary'
          weekly-discussion-id: ''
        env:
          REMYX_API_KEY: 'fake-key-for-test'
          ANTHROPIC_API_KEY: 'fake-anthropic-key-for-test'
        continue-on-error: true

      - name: Assert status is weekly_summary_skipped_no_discussion_id or error
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          # When mode=weekly-summary and weekly-discussion-id is empty,
          # the action should skip cleanly with weekly_summary_skipped_no_discussion_id.
          # If API keys are invalid, it may also produce 'error' or 'weekly_summary_failed'.
          # All of these are acceptable outcomes for this test scenario.
          if [ "$STATUS" = "weekly_summary_skipped_no_discussion_id" ]; then
            echo "PASS: got expected skip status"
          elif [ "$STATUS" = "weekly_summary_failed" ]; then
            echo "PASS: weekly summary failed (acceptable with fake API keys)"
          elif [ "$STATUS" = "error" ]; then
            echo "PASS: error status (acceptable with fake API keys)"
          elif [ "$OUTCOME" = "failure" ] && [ -z "$STATUS" ]; then
            echo "PASS: action failed without status output (acceptable with fake API keys)"
          else
            echo "FAIL: unexpected status '$STATUS' (outcome: $OUTCOME)"
            exit 1
          fi
