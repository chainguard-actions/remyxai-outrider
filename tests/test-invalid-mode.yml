name: Test invalid mode is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: not-a-real-mode
          enable-cocoindex: 'false'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on an unknown mode"
            exit 1
          fi
          case "$STATUS" in
            pr_opened*|issue_opened*|weekly_summary_posted|smoke_ok)
              echo "FAIL: unexpected success status '$STATUS'"
              exit 1
              ;;
          esac
          echo "PASS"
