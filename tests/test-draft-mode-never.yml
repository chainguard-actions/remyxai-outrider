name: Test draft-mode never with rate-limit disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          interest-id: 'test-interest-id-00000000-0000-0000-0000-000000000000'
          mode: 'recommend'
          min-confidence: 'low'
          draft-mode: 'never'
          rate-limit-days: '0'
          lookback: 'today'
          candidate-pool: '5'
          claude-timeout: '300'
        continue-on-error: true

      - name: Assert status output is set and is a known value
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          if [ -z "$STATUS" ]; then
            echo "FAIL: status output is empty"
            exit 1
          fi
          case "$STATUS" in
            pr_opened|pr_opened_draft|issue_opened|\
            skipped_low_confidence|skipped_open_artifact|\
            skipped_issues_disabled|skipped_pr_exists|\
            skipped_issue_exists|skipped_test_failure|\
            claude_failed|rejected_path_violations|error)
              echo "PASS: status='$STATUS' is a known recommend-mode value"
              ;;
            *)
              echo "FAIL: unexpected status value: $STATUS"
              exit 1
              ;;
          esac

      - name: Assert cost_usd output (if set) is numeric
        env:
          COST: ${{ steps.action.outputs.cost_usd }}
        run: |
          echo "cost_usd: $COST"
          if [ -z "$COST" ]; then
            echo "INFO: cost_usd is empty (acceptable when action errored early)"
          else
            if echo "$COST" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
              echo "PASS: cost_usd='$COST' is numeric"
            else
              echo "FAIL: cost_usd='$COST' is not a valid numeric value"
              exit 1
            fi
          fi
