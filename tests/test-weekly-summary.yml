name: Test weekly-summary mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      discussions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          interest-id: 'test-interest-uuid-placeholder'
          mode: 'weekly-summary'
          weekly-discussion-id: ''
        continue-on-error: true

      - name: Assert status is a valid weekly-summary status
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          # When weekly-discussion-id is empty, the action should skip cleanly
          # with "weekly_summary_skipped_no_discussion_id", or fail with
          # "weekly_summary_failed" / "error" if API keys are missing.
          VALID_STATUSES="weekly_summary_posted weekly_summary_skipped_no_discussion_id weekly_summary_failed error"
          if [ -z "$STATUS" ]; then
            echo "FAIL: status output is empty"
            exit 1
          fi
          FOUND=0
          for s in $VALID_STATUSES; do
            if [ "$STATUS" = "$s" ]; then
              FOUND=1
              break
            fi
          done
          if [ "$FOUND" = "0" ]; then
            echo "FAIL: status '$STATUS' is not a recognized weekly-summary status"
            exit 1
          fi
          echo "PASS: status='$STATUS' is a valid weekly-summary status"
