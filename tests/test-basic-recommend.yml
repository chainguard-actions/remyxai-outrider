name: Test basic recommend mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: 'test-interest-uuid-placeholder'
          mode: 'recommend'
          rate-limit-days: '0'
          min-confidence: 'low'
          chain: 'false'
          enable-cocoindex: 'false'

      - name: Assert action ran and produced a status output or failed gracefully
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          # Without a real REMYX_API_KEY or ANTHROPIC_API_KEY the action will
          # fail at the Python/CLI layer. That is acceptable — we verify it
          # does not crash the runner silently (outcome must be success or
          # failure, never skipped).
          if [ "$OUTCOME" = "success" ]; then
            # If somehow it succeeded, status must be a known value
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but status output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with status='$STATUS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real API keys)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
