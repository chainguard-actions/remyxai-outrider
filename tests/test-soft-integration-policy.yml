name: Test soft test-integration-policy with pin-arxiv
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          interest-id: 'test-interest-uuid-placeholder'
          mode: 'recommend'
          min-confidence: 'low'
          draft-mode: 'on_test_failure'
          rate-limit-days: '0'
          test-integration-policy: 'soft'
          lookback: 'month'
          candidate-pool: '10'
          pin-arxiv: '2401.00001'
          claude-timeout: '300'
        continue-on-error: true

      - name: Assert status output is non-empty and valid
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          VALID_STATUSES="pr_opened pr_opened_draft issue_opened skipped_low_confidence skipped_rate_limit skipped_pr_exists skipped_issue_exists skipped_test_failure claude_failed rejected_path_violations error"
          if [ -z "$STATUS" ]; then
            echo "FAIL: status output is empty"
            exit 1
          fi
          FOUND=0
          for s in $VALID_STATUSES; do
            if [ "$STATUS" = "$s" ]; then
              FOUND=1
              break
            fi
          done
          if [ "$FOUND" = "0" ]; then
            echo "FAIL: status '$STATUS' is not a recognized valid status"
            exit 1
          fi
          echo "PASS: status='$STATUS' is a valid status value"

      - name: Assert tier output is valid when set
        env:
          TIER: ${{ steps.action.outputs.tier }}
        run: |
          echo "tier: $TIER"
          if [ -n "$TIER" ]; then
            VALID_TIERS="high moderate low noise"
            FOUND=0
            for t in $VALID_TIERS; do
              if [ "$TIER" = "$t" ]; then
                FOUND=1
                break
              fi
            done
            if [ "$FOUND" = "0" ]; then
              echo "FAIL: tier '$TIER' is not a recognized valid tier"
              exit 1
            fi
            echo "PASS: tier='$TIER' is a valid tier value"
          else
            echo "PASS: tier is empty (no recommendation made)"
          fi
