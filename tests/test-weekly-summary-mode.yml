name: Test weekly-summary mode
on:
  workflow_dispatch:

jobs:
  test-weekly-summary-mode:
    runs-on: ubuntu-latest
    permissions:
      discussions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: 'test-interest-id-00000000-0000-0000-0000-000000000000'
          mode: 'weekly-summary'
          weekly-discussion-id: ''
          enable-cocoindex: 'false'

      - name: Assert weekly-summary mode ran and produced a status or failed gracefully
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but status output is empty"
              exit 1
            fi
            # When weekly-discussion-id is empty, the action should skip cleanly
            if [ "$STATUS" = "weekly_summary_skipped_no_discussion_id" ]; then
              echo "PASS: action skipped cleanly with no discussion id (status='$STATUS')"
            elif [ "$STATUS" = "weekly_summary_posted" ] || [ "$STATUS" = "weekly_summary_failed" ]; then
              echo "PASS: action ran weekly-summary mode with status='$STATUS'"
            else
              echo "PASS: action ran with status='$STATUS'"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid REMYX_API_KEY)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
