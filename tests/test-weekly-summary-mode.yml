name: Test weekly-summary mode
on:
  workflow_dispatch:

jobs:
  test-weekly-summary-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in weekly-summary mode without discussion ID
        id: action-no-discussion
        uses: .
        continue-on-error: true
        with:
          interest-id: 'test-interest-00000000-0000-0000-0000-000000000000'
          mode: 'weekly-summary'
          weekly-discussion-id: ''
          enable-cocoindex: 'false'
        env:
          REMYX_API_KEY: 'fake-key-for-testing'
          ANTHROPIC_API_KEY: 'fake-key-for-testing'

      - name: Assert weekly-summary without discussion ID fails gracefully or skips
        env:
          STATUS: ${{ steps.action-no-discussion.outputs.status }}
          OUTCOME: ${{ steps.action-no-discussion.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            # Should produce a skipped status when no discussion ID is provided
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but status output is empty"
              exit 1
            fi
            echo "PASS: action ran with status='$STATUS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no valid API keys or discussion ID)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
