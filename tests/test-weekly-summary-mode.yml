name: Test weekly-summary mode
on:
  workflow_dispatch:

jobs:
  test-weekly-summary-mode:
    runs-on: ubuntu-latest
    permissions:
      discussions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: 'test-interest-00000000-0000-0000-0000-000000000000'
          mode: 'weekly-summary'
          enable-cocoindex: 'false'
          # No weekly-discussion-id set — should result in skipped status

      - name: Assert action ran and produced a status or failed gracefully
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but status output is empty"
              exit 1
            fi
            # Without a discussion ID, expect the skipped status
            if [ "$STATUS" = "weekly_summary_skipped_no_discussion_id" ]; then
              echo "PASS: correctly skipped with no discussion ID"
            elif [ "$STATUS" = "weekly_summary_posted" ]; then
              echo "PASS: weekly summary posted"
            elif [ "$STATUS" = "weekly_summary_failed" ]; then
              echo "PASS: weekly summary failed (expected without real API key)"
            else
              echo "PASS: got status='$STATUS'"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real REMYX_API_KEY)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
