name: Test pin-arxiv with soft test-integration-policy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: 'test-interest-id-00000000-0000-0000-0000-000000000000'
          mode: 'recommend'
          min-confidence: 'low'
          draft-mode: 'on_test_failure'
          rate-limit-days: '0'
          test-integration-policy: 'soft'
          pin-arxiv: '2401.00001'
          lookback: 'month'
          candidate-pool: '10'
          claude-timeout: '300'

      - name: Assert status output is set
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          if [ -z "$STATUS" ]; then
            echo "FAIL: expected status output to be set (even on error)"
            exit 1
          fi
          echo "PASS: status is set to '$STATUS'"

      - name: Assert status is a known value
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          case "$STATUS" in
            pr_opened|pr_opened_draft|issue_opened|\
            skipped_low_confidence|skipped_open_artifact|\
            skipped_pr_exists|skipped_issue_exists|\
            skipped_test_failure|claude_failed|\
            rejected_path_violations|error)
              echo "PASS: status '$STATUS' is a valid recommend-mode status"
              ;;
            *)
              echo "FAIL: unexpected status value '$STATUS'"
              exit 1
              ;;
          esac

      - name: Assert cost_usd output is present or empty
        env:
          COST: ${{ steps.action.outputs.cost_usd }}
        run: |
          echo "cost_usd: $COST"
          # cost_usd may be empty if action errored before Claude ran
          echo "PASS: cost_usd output checked (value: '$COST')"

      - name: Assert arxiv output is present or empty
        env:
          ARXIV: ${{ steps.action.outputs.arxiv }}
        run: |
          echo "arxiv: $ARXIV"
          # arxiv may be empty if action errored before recommendation
          echo "PASS: arxiv output checked (value: '$ARXIV')"
