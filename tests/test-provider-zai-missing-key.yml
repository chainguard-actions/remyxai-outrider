name: Test provider=zai fails without ZAI_API_KEY
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: 'test-interest-id-00000000-0000-0000-0000-000000000000'
          mode: 'recommend'
          provider: 'zai'
          enable-cocoindex: 'false'
        # Intentionally NOT setting ZAI_API_KEY in env

      - name: Assert action fails when provider=zai but ZAI_API_KEY is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The "Configure backend from provider input" step should fail
          # with "provider=zai requires ZAI_API_KEY" error
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when ZAI_API_KEY is missing for provider=zai"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when ZAI_API_KEY is not set for provider=zai"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
