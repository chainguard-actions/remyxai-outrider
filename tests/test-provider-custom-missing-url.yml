name: Test provider=custom fails when model-base-url is not set
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          interest-id: 'test-interest-id-placeholder'
          mode: 'recommend'
          provider: 'custom'
          model-base-url: ''
          enable-cocoindex: 'false'
        env:
          REMYX_API_KEY: 'fake-key-for-test'
          ANTHROPIC_API_KEY: 'fake-anthropic-key-for-test'
        continue-on-error: true

      - name: Assert action failed due to missing model-base-url for provider=custom
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when model-base-url is missing for provider=custom"
          else
            echo "FAIL: expected failure but got outcome: $OUTCOME"
            exit 1
          fi
