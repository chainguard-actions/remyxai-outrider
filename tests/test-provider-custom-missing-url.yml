name: Test provider=custom fails without model-base-url
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: 'test-interest-id-00000000-0000-0000-0000-000000000000'
          mode: 'recommend'
          provider: 'custom'
          model-base-url: ''
          enable-cocoindex: 'false'
        env:
          ANTHROPIC_API_KEY: 'fake-key-for-validation-test'

      - name: Assert action fails when provider=custom but model-base-url is empty
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The "Configure backend from provider input" step should fail
          # with "provider=custom requires model-base-url to be set"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when model-base-url is missing for provider=custom"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when model-base-url is not set for provider=custom"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
