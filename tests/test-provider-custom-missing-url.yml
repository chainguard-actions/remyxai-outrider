name: Test custom provider requires model-base-url
on:
  workflow_dispatch:

jobs:
  test-custom-missing-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action's "Configure backend from provider input" step checks that
      # model-base-url is set when provider=custom. Without it, the step exits 1
      # with a clear error message. We verify the action fails cleanly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: 'test-interest-id-placeholder'
          provider: 'custom'
          # model-base-url intentionally NOT set
        env:
          REMYX_API_KEY: 'placeholder-not-real'
          ANTHROPIC_API_KEY: 'placeholder-not-real'

      - name: Assert action failed due to missing model-base-url for custom provider
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when model-base-url is missing for provider=custom, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when model-base-url is missing for provider=custom"
