name: Test provider validation fails cleanly for unknown provider
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          interest-id: 'test-interest-id-placeholder'
          mode: 'recommend'
          provider: 'invalid-provider-xyz'
        env:
          REMYX_API_KEY: 'fake-key-for-test'
          ANTHROPIC_API_KEY: 'fake-anthropic-key-for-test'
        continue-on-error: true

      - name: Assert action failed due to unknown provider
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for unknown provider"
          else
            echo "INFO: outcome was '$OUTCOME' — provider validation may have been bypassed"
          fi
