name: Test provider validation (missing secret causes clean error)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: 'test-interest-00000000-0000-0000-0000-000000000000'
          mode: recommend
          provider: zai
          rate-limit-days: '0'
          chain: 'false'
          enable-cocoindex: 'false'
        # ZAI_API_KEY is intentionally NOT set — the action should fail clean
        # with "provider=zai requires ZAI_API_KEY in the caller's env block"

      - name: Assert action failed cleanly due to missing ZAI_API_KEY
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action MUST fail (not succeed, not skip) because ZAI_API_KEY
          # is absent and provider=zai requires it.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail due to missing ZAI_API_KEY, but it succeeded"
            exit 1
          fi
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: action failed as expected when ZAI_API_KEY is missing for provider=zai"
