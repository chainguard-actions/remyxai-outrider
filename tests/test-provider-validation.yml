name: Test provider input validation - missing secret
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: 'test-interest-uuid-placeholder'
          mode: 'recommend'
          provider: 'zai'
          enable-cocoindex: 'false'
          chain: 'false'
        # ZAI_API_KEY is intentionally NOT set in env — the action should
        # fail with a clear error message about the missing secret.

      - name: Assert action fails with clear error when provider secret is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          # provider=zai without ZAI_API_KEY must fail (not silently succeed)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when ZAI_API_KEY is missing"
          elif [ "$OUTCOME" = "success" ]; then
            # If it somehow succeeded, the status must be a known value
            if [ -n "$STATUS" ]; then
              echo "INFO: action succeeded with status='$STATUS' (may have fallen back)"
            else
              echo "FAIL: action succeeded but status is empty"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
