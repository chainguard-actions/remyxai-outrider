name: Test provider input validation
on:
  workflow_dispatch:

jobs:
  test-unknown-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action's "Configure backend from provider input" step runs a bash
      # case statement that exits 1 with a clear error for unknown providers.
      # We verify the action fails (exit non-zero) when given an unknown provider.
      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: 'test-interest-id-placeholder'
          provider: 'unknown-provider-xyz'
        env:
          REMYX_API_KEY: 'placeholder-not-real'
          ANTHROPIC_API_KEY: 'placeholder-not-real'

      - name: Assert action failed on unknown provider
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unknown provider, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for unknown provider"
