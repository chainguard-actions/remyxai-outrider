name: Test high confidence threshold and custom inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          interest-id: 'test-interest-id-00000000-0000-0000-0000-000000000000'
          mode: 'recommend'
          min-confidence: 'high'
          draft-mode: 'never'
          rate-limit-days: '0'
          test-integration-policy: 'soft'
          lookback: 'today'
          candidate-pool: '5'
          claude-timeout: '300'
        continue-on-error: true

      - name: Assert status output is set
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          if [ -z "$STATUS" ]; then
            echo "FAIL: expected status output to be set (got empty string)"
            exit 1
          fi
          echo "PASS: status output is set to '$STATUS'"

      - name: Assert status is a known value
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          case "$STATUS" in
            pr_opened|pr_opened_draft|issue_opened|\
            skipped_low_confidence|skipped_rate_limit|\
            skipped_pr_exists|skipped_issue_exists|\
            skipped_test_failure|claude_failed|\
            rejected_path_violations|error)
              echo "PASS: status '$STATUS' is a recognized value"
              ;;
            *)
              echo "FAIL: status '$STATUS' is not a recognized value"
              exit 1
              ;;
          esac

      - name: Assert cost_usd output is set or empty (numeric or empty)
        env:
          COST: ${{ steps.action.outputs.cost_usd }}
        run: |
          echo "cost_usd: $COST"
          if [ -n "$COST" ]; then
            # If set, it should be a valid number (possibly 0.0)
            if echo "$COST" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
              echo "PASS: cost_usd '$COST' is a valid number"
            else
              echo "FAIL: cost_usd '$COST' is not a valid number"
              exit 1
            fi
          else
            echo "PASS: cost_usd is empty (no Claude passes ran)"
          fi
