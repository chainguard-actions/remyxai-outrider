name: Test high confidence tier gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          interest-id: 'test-interest-00000000-0000-0000-0000-000000000001'
          min-confidence: 'high'
          draft-mode: 'never'
          rate-limit-days: '0'
          lookback: 'today'
          candidate-pool: '5'
        continue-on-error: true

      - name: Assert status output is set and recognized
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          VALID_STATUSES="pr_opened pr_opened_draft issue_opened skipped_low_confidence skipped_rate_limit skipped_pr_exists skipped_issue_exists skipped_test_failure claude_failed rejected_path_violations error"
          if [ -z "$STATUS" ]; then
            echo "FAIL: status output is empty"
            exit 1
          fi
          FOUND=0
          for s in $VALID_STATUSES; do
            if [ "$STATUS" = "$s" ]; then
              FOUND=1
              break
            fi
          done
          if [ "$FOUND" = "0" ]; then
            echo "FAIL: status '$STATUS' is not a recognized value"
            exit 1
          fi
          echo "PASS: status='$STATUS' is a recognized value"
