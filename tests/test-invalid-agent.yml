name: Test invalid agent is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: weekly-summary
          agent: definitely-not-an-agent
          enable-cocoindex: 'false'
      - name: Assert action failed before running
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: '$STATUS'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on an unknown agent"
            exit 1
          fi
          if [ -n "$STATUS" ]; then
            echo "FAIL: run.py should not have produced a status, got '$STATUS'"
            exit 1
          fi
          echo "PASS"
