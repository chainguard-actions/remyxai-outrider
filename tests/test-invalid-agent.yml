name: Test invalid agent input is rejected
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          interest-id: 'test-interest-00000000-0000-0000-0000-000000000000'
          mode: 'smoke'
          agent: 'invalid-agent-xyz'
          enable-cocoindex: 'false'

      - name: Assert action failed due to invalid agent
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected unknown agent 'invalid-agent-xyz'"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected unknown agent but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
