name: Test fidelity mode with pr-number input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          interest-id: 'invalid-interest-id-for-testing'
          mode: 'fidelity'
          pr-number: '1'
          chain: 'false'
          enable-cocoindex: 'false'
        env:
          REMYX_API_KEY: 'invalid-test-key'
          ANTHROPIC_API_KEY: 'invalid-test-key'
        continue-on-error: true

      - name: Assert action ran (not skipped) and produced a recognizable outcome
        env:
          ACTUAL: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "actual status: $ACTUAL"
          # The action step should have run (success or failure), not been skipped
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          # Accept any outcome: the action either set a status (any value is fine —
          # documented or undocumented) or failed before setting outputs.
          # Both are valid when running with invalid credentials.
          echo "PASS: action ran with outcome='$OUTCOME' status='$ACTUAL'"
